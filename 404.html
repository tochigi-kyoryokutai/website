<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ページが見つかりません | 一般社団法人とちぎ地域おこし協力隊ネットワーク</title>
  <meta name="robots" content="noindex">
  <!--
    このファイルだけの特例:
    カスタム404は「存在しないURL」のパスを基準に相対解決されるため、文書相対パスは使わない。
    CSSはインライン化し、リンクはルート相対パスで書く。
    Cloudflare Pages の仮URL・独自ドメインともルート配信なので、ドメイン接続時の書き換えは不要。
  -->
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "BIZ UDPGothic",
                   "Yu Gothic Medium", "Noto Sans JP", system-ui, sans-serif;
      line-height: 1.9;
      color: #333333;
      background: #faf8f2;
    }
    main {
      max-width: 42rem;
      margin-inline: auto;
      padding: 4rem 1.5rem;
    }
    h1 {
      font-family: "BIZ UDMincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
      font-weight: 600;
      font-size: 1.75rem;
      letter-spacing: 0.04em;
      color: #2d5a3d;
      border-left: 0.25rem solid #2d5a3d;
      padding-left: 0.6em;
      line-height: 1.5;
    }
    a { color: #2d5a3d; text-underline-offset: 0.2em; }
    .button {
      display: inline-block;
      margin-top: 1.5rem;
      background: #2d5a3d;
      color: #ffffff;
      padding: 0.75em 1.75em;
      border-radius: 4px;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
<main>
  <h1>ページが見つかりません</h1>
  <p>お探しのページは、移動または削除された可能性があります。URLをご確認いただくか、トップページからご覧ください。</p>
  <p><a class="button" href="/">トップページへ戻る</a></p>
  <p><a href="/contact.html">お問い合わせはこちら</a></p>
</main>
</body>
</html>
